version: 2
updates:
  - package-ecosystem: nuget
    directory: "/"
    target-branch: release/0.4.0
    schedule:
      interval: weekly
    groups:
      dotnet:
        patterns: ["*"]
    ignore:
      # Held at 4.x: MailKit 5 changes SmtpClient.SendAsync (owner decision, TODO.md).
      - dependency-name: MailKit
        update-types: ["version-update:semver-major"]
      # .NET 11 packages wait for the deferred .NET 11 upgrade (owner decision, TODO.md).
      - dependency-name: "Microsoft.AspNetCore.*"
        versions: [">= 11.0.0"]
      - dependency-name: "Microsoft.EntityFrameworkCore*"
        versions: [">= 11.0.0"]
      - dependency-name: "Microsoft.Extensions.*"
        versions: [">= 11.0.0"]
      - dependency-name: "System.*"
        versions: [">= 11.0.0"]

  - package-ecosystem: github-actions
    directory: "/"
    target-branch: release/0.4.0
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # Playwright release gate (tests/e2e). Playwright and its browser move together, so updates come as one group.
  - package-ecosystem: npm
    directory: "/tests/e2e"
    target-branch: release/0.4.0
    schedule:
      interval: weekly
    groups:
      e2e:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: "/docker"
    target-branch: release/0.4.0
    schedule:
      interval: weekly

  - package-ecosystem: docker-compose
    directory: "/"
    target-branch: release/0.4.0
    schedule:
      interval: weekly
    ignore:
      # The platform targets PostgreSQL 17 (compose, Testcontainers and Azure Flexible Server move together).
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]
