version: 2
updates:
  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: weekly
    groups:
      dotnet:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # Playwright release gate (tests/e2e). Playwright and its browser move together, so updates come as one group.
  - package-ecosystem: npm
    directory: "/tests/e2e"
    schedule:
      interval: weekly
    groups:
      e2e:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: "/docker"
    schedule:
      interval: weekly

  - package-ecosystem: docker-compose
    directory: "/"
    schedule:
      interval: weekly
    ignore:
      # The platform targets PostgreSQL 17 (compose, Testcontainers and Azure Flexible Server move together).
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]
