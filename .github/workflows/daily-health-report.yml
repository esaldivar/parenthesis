name: Daily Discord health report

on:
  schedule:
    - cron: '0 8 * * *'
      timezone: America/Chicago
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-discord-health-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Test report logic (no network or secrets)
        run: node --test .github/scripts/daily-health-report.test.mjs
      - name: Send UptimeRobot summary to Discord
        env:
          UPTIMEROBOT_API_KEY: ${{ secrets.UPTIMEROBOT_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: node .github/scripts/daily-health-report.mjs
