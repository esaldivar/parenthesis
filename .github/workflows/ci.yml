name: CI

# Every PR is checked. main, develop and release/x.y.z only change through PRs (protected branches; see
# docs/development-workflow.md), and are re-checked after each merge.
on:
  pull_request:
  push:
    branches: [main, develop, "release/**"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  CI: "true"

jobs:
  # The PR source check (which branches may merge into main, develop and release/*) is in pr-branch-policy.yml.

  release-security-tests:
    name: Production security verification tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Verify release and security policy regressions (no network or secrets)
        run: |
          node --test .github/scripts/production-security.test.mjs .github/scripts/sonar-release-gate.test.mjs
          bash .github/scripts/production-plan.test.sh

  e2e-tooling:
    name: E2E tooling (typecheck and report policy)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: tests/e2e
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: src/frontend/.nvmrc
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: node --test scripts/summary-policy.test.mjs
      # Discovery only; browser journeys retain release/* -> develop execution policy.
      - run: npm test -- --list

  backend:
    name: Backend (build, format, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore CoParent.slnx

      - name: Build (warnings are errors)
        run: dotnet build CoParent.slnx -c Release --no-restore

      - name: Check formatting
        run: dotnet format CoParent.slnx --verify-no-changes --no-restore

      # Integration tests start PostgreSQL with Testcontainers on the runner's Docker.
      - name: Test (unit, integration, architecture)
        run: dotnet test --solution CoParent.slnx -c Release --no-build

  frontend:
    name: Frontend (lint, test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: src/frontend/.nvmrc
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      # No dependency install scripts (issue #65); lint, tests and the build don't need them.
      - name: Install
        run: npm ci --ignore-scripts

      - name: Lint (TypeScript + template accessibility rules)
        run: npm run lint

      - name: Test (Vitest, axe-core, token contrast)
        run: npm test

      - name: Build (production)
        run: npm run build # The Angular CLI pinned in the lockfile, not an on-demand npx install.

  docker:
    name: API image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Build image (not pushed)
        run: docker build -f docker/api.Dockerfile -t parenthesis-api:${{ github.sha }} .

      - name: Smoke test liveness and the bundled app
        run: |
          docker run -d --name api -p 8080:8080 \
            -e ConnectionStrings__Postgres="Host=localhost;Database=unused" \
            parenthesis-api:${{ github.sha }}
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/health/live; then
              echo
              curl -fsS http://localhost:8080/ | grep -q '<app-root' && echo "App shell served" && exit 0
              echo "The Angular app was not served at /"; docker logs api; exit 1
            fi
            sleep 1
          done
          docker logs api
          exit 1
