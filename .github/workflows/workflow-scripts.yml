name: Workflow scripts

# Unit tests for the workflow automation in .github/scripts (dev-workflow.mjs and sonar-release-gate.mjs). No secrets:
# the release gate is tested against a fake SonarQube Cloud API.
on:
  pull_request:
    paths:
      - ".github/scripts/**"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  test:
    name: Workflow script tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github
          persist-credentials: false

      - name: Test the workflow scripts
        run: node --test .github/scripts/dev-workflow.test.mjs .github/scripts/sonar-release-gate.test.mjs
