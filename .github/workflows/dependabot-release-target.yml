name: Dependabot release target

on:
  pull_request_target:
    types: [opened, reopened, edited]
  # Independent trusted run also handles Dependabot events with a read-only token.
  # No artifacts or code from the triggering run are read or executed.
  workflow_run:
    workflows: [PR branch policy]
    types: [completed]
  milestone:
    types: [opened, closed, edited, deleted]
  create:
  schedule:
    - cron: '23 14 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pull-requests: write

concurrency:
  group: dependabot-release-target
  cancel-in-progress: false

jobs:
  route:
    if: github.event_name != 'pull_request_target' || github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # No ref: checkout takes the commit this workflow file was read from (the PR's base branch, the default branch,
      # or a newly created branch, which already controls this file), so it never runs more than the workflow itself
      # trusts. Never check out a dependency PR head, and don't set a ref (SonarQube githubactions:S7631).
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false
      - name: Route dependency PRs to the latest release with an open milestone
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/dependabot-release-target.mjs
