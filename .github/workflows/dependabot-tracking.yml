name: Dependabot tracking issues

on:
  workflow_run:
    workflows: [PR branch policy]
    types: [completed]

permissions: {}

concurrency:
  group: dependabot-tracking-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  track:
    if: github.event.workflow_run.event == 'pull_request' && startsWith(github.event.workflow_run.head_branch, 'dependabot/')
    runs-on: ubuntu-latest
    timeout-minutes: 4
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      # workflow_run checks out the trusted default-branch commit that supplies this workflow.
      # Omit ref so checkout uses that event context. The triggering PR supplies no code or artifacts.
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false
      - name: Create and link a Dependabot tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/dependabot-tracking.mjs
