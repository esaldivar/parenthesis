name: Playwright investigation
on:
  pull_request:
    branches: [release/0.3.0]
    types: [opened, synchronize, reopened]
permissions:
  contents: read
concurrency:
  group: playwright-investigation-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  e2e:
    name: Playwright (release candidate)
    if: github.head_ref == 'fix/playwright-release-recovery' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:17.11-alpine
        env:
          POSTGRES_USER: e2e
          POSTGRES_PASSWORD: e2e
          POSTGRES_DB: coparent
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U e2e -d coparent"
          --health-interval 5s --health-timeout 3s --health-retries 10
      mailpit:
        image: axllent/mailpit:v1.31.6
        env:
          MP_SMTP_AUTH_ACCEPT_ANY: "1"
          MP_SMTP_AUTH_ALLOW_INSECURE: "1"
        ports: ["1025:1025", "8025:8025"]
        options: >-
          --health-cmd "/mailpit readyz"
          --health-interval 5s --health-timeout 3s --health-retries 10
    defaults:
      run:
        working-directory: tests/e2e
    env:
      CI: "true"
      E2E_BASE_URL: https://localhost:8443
      MAILPIT_URL: http://localhost:8025
      E2E_TESTED_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      # The same Dockerfile as the CI "API image" job, with layers cached between release runs.
      - name: Build the release candidate image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: docker/api.Dockerfile
          tags: parenthesis-api:rc
          load: true
          push: false
          cache-from: type=gha,scope=playwright-release
          cache-to: type=gha,mode=max,scope=playwright-release

      - name: Start the release candidate
        run: ./scripts/start-release-candidate.sh parenthesis-api:rc

      - uses: actions/setup-node@v5
        with:
          node-version-file: src/frontend/.nvmrc
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json

      # No dependency install scripts (issue #65); Playwright's browser is installed below by its own CLI.
      - name: Install test dependencies
        run: npm ci --ignore-scripts

      - name: Find the Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache the browser
        id: browser-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-mobile-v1-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Chromium and WebKit
        if: steps.browser-cache.outputs.cache-hit != 'true'
        run: npm run browser:install

      - name: Install browser system libraries
        if: steps.browser-cache.outputs.cache-hit == 'true'
        run: npm run browser:deps

      - name: Run the release gate (every milestone)
        run: |
          echo "E2E_RUN_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
          npm test

      # Totals, duration, per-milestone and regression results. Also fails if a milestone lost its tests.
      - name: Summarize
        if: ${{ !cancelled() }}
        run: node scripts/summarize.mjs

      - name: API logs
        if: failure()
        working-directory: .
        run: docker logs api > api.log 2>&1 || true

      - name: Upload the HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            tests/e2e/playwright-report/
            tests/e2e/test-results/
          retention-days: 14

      - name: Upload failure screenshots, traces and API logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-failures
          path: |
            tests/e2e/test-results/
            api.log
          retention-days: 14

      # Read by the Discord job, which runs no PR code.
      - name: Upload the summary
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-summary
          path: tests/e2e/results/summary.json
          retention-days: 14

