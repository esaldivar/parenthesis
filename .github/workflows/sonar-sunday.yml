name: Sonar Sunday

# Weekly review of SonarQube Cloud's findings on main (owner decision, October 17, 2026). Every Sunday this opens an
# issue listing open vulnerabilities, bugs, security hotspots and code smells as a checklist. Fixes go on a
# fix/sonar-sunday-<date> branch with a PR into the active release/x.y.z branch, and reach main with that release's
# window (or a hotfix, if urgent). See docs/development-workflow.md. It can also be run by hand from the Actions tab.
on:
  schedule:
    - cron: "0 14 * * 0" # Sundays 14:00 UTC (9 AM Central, 8 AM in winter).
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  report:
    name: Weekly SonarQube Cloud report
    if: vars.SONAR_PROJECT_KEY != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      KEY: ${{ vars.SONAR_PROJECT_KEY }}
      API: https://sonarcloud.io/api
    steps:
      - name: Fetch findings on main
        run: |
          get() { curl -fsS -u "$SONAR_TOKEN:" "$API/$1"; }
          get "qualitygates/project_status?projectKey=$KEY&branch=main" > gate.json
          get "measures/component?component=$KEY&branch=main&metricKeys=vulnerabilities,bugs,security_hotspots,code_smells,coverage,duplicated_lines_density,sqale_index" > measures.json
          get "issues/search?componentKeys=$KEY&branch=main&resolved=false&types=VULNERABILITY,BUG&ps=100" > risks.json
          get "issues/search?componentKeys=$KEY&branch=main&resolved=false&types=CODE_SMELL&severities=BLOCKER,CRITICAL,MAJOR&ps=50" > smells.json
          get "hotspots/search?projectKey=$KEY&branch=main&status=TO_REVIEW&ps=100" > hotspots.json

      - name: Write the issue
        run: |
          today=$(date -u +%Y-%m-%d)
          link="https://sonarcloud.io/project/issues?id=$KEY&branch=main"
          item() { jq -r --arg id "$KEY" '.issues[] | "- [ ] **\(.severity)** \(.type | ascii_downcase | gsub("_"; " ")): \(.message) — `\(.component | split(":")[1]):\(.line // "")` ([open](https://sonarcloud.io/project/issues?id=\($id)&branch=main&open=\(.key)))"' "$1"; }
          {
            echo "Weekly review of SonarQube Cloud's findings on \`main\`, for $today."
            echo
            echo "**Quality gate on main:** $(jq -r '.projectStatus.status' gate.json)"
            echo
            echo "| Vulnerabilities | Bugs | Hotspots to review | Code smells | Coverage | Duplication | Technical debt |"
            echo "|---|---|---|---|---|---|---|"
            jq -r '[.component.measures[] | {(.metric): .value}] | add
              | "| \(.vulnerabilities // "0") | \(.bugs // "0") | \(.security_hotspots // "0") | \(.code_smells // "0") | \(.coverage // "n/a")% | \(.duplicated_lines_density // "0")% | \(((.sqale_index // "0") | tonumber / 60 | floor)) h |"' measures.json
            echo
            echo "### 1. Vulnerabilities and bugs (fix first)"
            [ "$(jq '.issues | length' risks.json)" -gt 0 ] && item risks.json || echo "None."
            echo
            echo "### 2. Security hotspots to review"
            if [ "$(jq '.hotspots | length' hotspots.json)" -gt 0 ]; then
              jq -r --arg id "$KEY" '.hotspots[] | "- [ ] **\(.vulnerabilityProbability)** \(.message) — `\(.component | split(":")[1]):\(.line // "")` ([review](https://sonarcloud.io/project/security_hotspots?id=\($id)&branch=main&hotspots=\(.key)))"' hotspots.json
            else echo "None."; fi
            echo
            echo "### 3. Major code smells (blocker, critical, major)"
            [ "$(jq '.issues | length' smells.json)" -gt 0 ] && item smells.json || echo "None."
            echo
            echo "---"
            echo "**This week:**"
            echo "1. Fix the items above on a \`fix/sonar-sunday-$today\` branch, with a PR into the active \`release/x.y.z\` branch (link it here)."
            echo "   Anything deliberate gets marked **Accepted** in SonarCloud, with a reason."
            echo "2. The fixes reach the site with the next release window. A vulnerability that can't wait is a \`hotfix/…\` from \`main\`."
            echo
            echo "All findings: $link"
          } > body.md

      - name: Open the issue
        run: |
          today=$(date -u +%Y-%m-%d)
          gh label create sonar-sunday --repo "$GITHUB_REPOSITORY" --color 1F6FEB --description "Weekly SonarQube Cloud review" --force
          gh issue create --repo "$GITHUB_REPOSITORY" --title "Sonar Sunday: $today" --label sonar-sunday --body-file body.md
