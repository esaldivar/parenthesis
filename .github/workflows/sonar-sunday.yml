name: Sonar Sunday

# Weekly review of SonarQube Cloud's findings on develop, its analysed branch since #373 (October 29, 2026; first on
# main, owner decision October 17, 2026). Every Sunday this opens an
# issue listing open vulnerabilities, bugs, security hotspots and code smells as a checklist. Fixes go on a
# fix/sonar-sunday-<date> branch with a PR into the active release/x.y.z branch, and reach main with that release's
# window (or a hotfix, if urgent). See docs/development-workflow.md. It can also be run by hand from the Actions tab.
#
# Claude's queue (owner request, October 30, 2026): a week with findings is titled "Week of <Sunday> Sonar findings",
# labelled claude-implementation, put in the active release's milestone, and added to Project #2 as Ready For
# Development, P0 - Critical, Work Type Development. It is NOT approved: the queue only runs it once the owner adds
# owner-approved-claude (docs/runbooks/claude-local-queue.md). Re-running in the same week updates that week's issue
# instead of opening another, and never edits one the owner has already approved. The board step needs the
# PROJECTS_TOKEN secret with write access to projects.
on:
  schedule:
    - cron: "0 14 * * 0" # Sundays 14:00 UTC (9 AM Central, 8 AM in winter).
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  report:
    name: Weekly SonarQube Cloud report
    if: vars.SONAR_PROJECT_KEY != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      KEY: ${{ vars.SONAR_PROJECT_KEY }}
      API: https://sonarcloud.io/api
      PROJECT_NUMBER: 2 # The board Claude's queue reads (scripts/claude_queue_board.py).
    steps:
      - name: Name the week and find the queue milestone
        id: week
        run: |
          # The most recent Sunday, today included, so a manual run mid-week files under the same week.
          sunday=$(date -u -d "today -$(date -u +%w) days" +%Y-%m-%d)
          day=$(date -u -d "$sunday" +%-d)
          case $day in 1 | 21 | 31) suffix=st ;; 2 | 22) suffix=nd ;; 3 | 23) suffix=rd ;; *) suffix=th ;; esac
          echo "sunday=$sunday" >> "$GITHUB_OUTPUT"
          echo "title=Week of $(date -u -d "$sunday" +%B) $day$suffix, $(date -u -d "$sunday" +%Y) Sonar findings" >> "$GITHUB_OUTPUT"
          # The active release is the highest release/x.y.z branch; its milestone is "Mn — …" (0.n.0) or "vX.Y — …".
          release=$(gh api --paginate "repos/$GITHUB_REPOSITORY/branches?per_page=100" --jq '.[].name' \
            | sed -nE 's#^release/([0-9]+\.[0-9]+\.[0-9]+)$#\1#p' | sort -V | tail -1)
          milestone=$(gh api "repos/$GITHUB_REPOSITORY/milestones?state=open&per_page=100" | jq -r --arg r "$release" '
            .[] | .title as $t
            | ((($t | capture("^M(?<m>[0-9]+)\\b")? | "0.\(.m | tonumber).0"))
               // ($t | capture("^v(?<a>[0-9]+)\\.(?<b>[0-9]+)\\b")? | "\(.a | tonumber).\(.b | tonumber).0"))
            | select(. == $r) | $t' | head -1)
          echo "milestone=$milestone" >> "$GITHUB_OUTPUT"
          echo "Week: $sunday. Active release: ${release:-none}. Milestone: ${milestone:-none}."

      - name: Fetch findings on develop
        run: |
          get() { curl -fsS -u "$SONAR_TOKEN:" "$API/$1"; }
          get "qualitygates/project_status?projectKey=$KEY&branch=develop" > gate.json
          get "measures/component?component=$KEY&branch=develop&metricKeys=vulnerabilities,bugs,security_hotspots,code_smells,coverage,duplicated_lines_density,sqale_index" > measures.json
          get "issues/search?componentKeys=$KEY&branch=develop&resolved=false&types=VULNERABILITY,BUG&ps=100" > risks.json
          get "issues/search?componentKeys=$KEY&branch=develop&resolved=false&types=CODE_SMELL&severities=BLOCKER,CRITICAL,MAJOR&ps=50" > smells.json
          get "hotspots/search?projectKey=$KEY&branch=develop&status=TO_REVIEW&ps=100" > hotspots.json
          get "project_analyses/search?project=$KEY&branch=develop&ps=1" > analyses.json

      - name: Write the issue
        run: |
          today=$(date -u +%Y-%m-%d)
          link="https://sonarcloud.io/project/issues?id=$KEY&branch=develop"
          item() { jq -r --arg id "$KEY" '.issues[] | "- [ ] **\(.severity)** \(.type | ascii_downcase | gsub("_"; " ")): \(.message) — `\(.component | split(":")[1]):\(.line // "")` ([open](https://sonarcloud.io/project/issues?id=\($id)&branch=develop&open=\(.key)))"' "$1"; }
          {
            echo "Weekly review of SonarQube Cloud's findings on \`develop\`, for $today."
            echo
            echo "**Quality gate on develop:** $(jq -r '.projectStatus.status' gate.json)"
            echo
            # Say which analysis this is, and warn when it's missing or older than a week (develop hasn't been scanned).
            analysed=$(jq -r '.analyses[0].date // empty' analyses.json)
            revision=$(jq -r '.analyses[0].revision // empty' analyses.json)
            if [ -z "$analysed" ]; then
              echo "> [!WARNING]"
              echo "> **No analysis of \`develop\` was found, so this report is incomplete.** Check the SonarQube Cloud job in \`sonar.yml\`."
            else
              echo "**Analysis:** $analysed, commit \`${revision:0:7}\`."
              if [ "$(date -u -d "$analysed" +%s)" -lt "$(date -u -d '8 days ago' +%s)" ]; then
                echo
                echo "> [!WARNING]"
                echo "> **This analysis is more than a week old**, so the findings below may be stale. Check that pushes to \`develop\` are still scanned."
              fi
            fi
            echo
            echo "| Vulnerabilities | Bugs | Hotspots to review | Code smells | Coverage | Duplication | Technical debt |"
            echo "|---|---|---|---|---|---|---|"
            jq -r '[.component.measures[] | {(.metric): .value}] | add
              | "| \(.vulnerabilities // "0") | \(.bugs // "0") | \(.security_hotspots // "0") | \(.code_smells // "0") | \(.coverage // "n/a")% | \(.duplicated_lines_density // "0")% | \(((.sqale_index // "0") | tonumber / 60 | floor)) h |"' measures.json
            echo
            echo "### 1. Vulnerabilities and bugs (fix first)"
            [ "$(jq '.issues | length' risks.json)" -gt 0 ] && item risks.json || echo "None."
            echo
            echo "### 2. Security hotspots to review"
            if [ "$(jq '.hotspots | length' hotspots.json)" -gt 0 ]; then
              jq -r --arg id "$KEY" '.hotspots[] | "- [ ] **\(.vulnerabilityProbability)** \(.message) — `\(.component | split(":")[1]):\(.line // "")` ([review](https://sonarcloud.io/project/security_hotspots?id=\($id)&branch=develop&hotspots=\(.key)))"' hotspots.json
            else echo "None."; fi
            echo
            echo "### 3. Major code smells (blocker, critical, major)"
            [ "$(jq '.issues | length' smells.json)" -gt 0 ] && item smells.json || echo "None."
            echo
            echo "---"
            echo "**This week:**"
            echo "1. Fix the items above on a \`fix/sonar-sunday-$today\` branch, with a PR into the active \`release/x.y.z\` branch (link it here)."
            echo "   Anything deliberate gets marked **Accepted** in SonarCloud, with a reason."
            echo "2. The fixes reach the site with the next release window. A vulnerability that can't wait is a \`hotfix/…\` from \`main\`."
            echo
            echo "All findings: $link"
          } > body.md

      - name: Open or update this week's issue
        id: issue
        env:
          TITLE: ${{ steps.week.outputs.title }}
          MILESTONE: ${{ steps.week.outputs.milestone }}
        run: |
          found=$(( $(jq '.issues | length' risks.json) + $(jq '.hotspots | length' hotspots.json) + $(jq '.issues | length' smells.json) ))
          if [ "$found" -gt 0 ]; then
            {
              echo "> **Claude's queue:** Ready For Development · P0 - Critical · Development. Claude picks this up only after"
              echo "> the owner reviews it and adds \`owner-approved-claude\`."
              echo
              cat body.md
            } > issue.md
          else
            cp body.md issue.md
          fi
          gh label create sonar-sunday --repo "$GITHUB_REPOSITORY" --color 1F6FEB --description "Weekly SonarQube Cloud review" --force

          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --label sonar-sunday --state all --limit 20 \
            --json number,title,labels | jq -c --arg t "$TITLE" '[.[] | select(.title == $t)][0] // empty')
          if [ -n "$existing" ]; then
            number=$(jq -r .number <<<"$existing")
            if jq -e '.labels | any(.name == "owner-approved-claude")' <<<"$existing" > /dev/null; then
              echo "#$number is already approved for Claude, so its text is left as it is (editing it would undo the approval)."
            else
              gh issue edit "$number" --repo "$GITHUB_REPOSITORY" --body-file issue.md
              echo "Updated #$number."
            fi
            exit 0
          fi

          args=(--repo "$GITHUB_REPOSITORY" --title "$TITLE" --label sonar-sunday --body-file issue.md)
          if [ "$found" -gt 0 ]; then
            args+=(--label claude-implementation)
            if [ -n "$MILESTONE" ]; then args+=(--milestone "$MILESTONE")
            else echo "::warning::No open milestone matches the active release branch, so Claude's queue won't see this issue until one is set."; fi
          fi
          url=$(gh issue create "${args[@]}")
          echo "Opened $url ($found findings)."
          if [ "$found" -gt 0 ]; then echo "queue=$url" >> "$GITHUB_OUTPUT"; fi

      # Only a new issue with findings goes on the board, so a re-run never moves an issue the queue already started.
      - name: Put it on Claude's board
        if: steps.issue.outputs.queue != ''
        env:
          GH_TOKEN: ${{ secrets.PROJECTS_TOKEN }}
          ISSUE_URL: ${{ steps.issue.outputs.queue }}
          OWNER: ${{ github.repository_owner }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::The PROJECTS_TOKEN secret is missing, so $ISSUE_URL wasn't added to Project #$PROJECT_NUMBER."
            exit 1
          fi
          gh api graphql -F number="$PROJECT_NUMBER" -f owner="$OWNER" -f query='
            query($owner: String!, $number: Int!) { repositoryOwner(login: $owner) { ... on ProjectV2Owner {
              projectV2(number: $number) { id fields(first: 50) { nodes {
                ... on ProjectV2SingleSelectField { id name options { id name } } } } } } } }' > project.json
          project=$(jq -r '.data.repositoryOwner.projectV2.id // empty' project.json)
          [ -n "$project" ] || { echo "::error::Couldn't read Project #$PROJECT_NUMBER. Does PROJECTS_TOKEN have the project scope?"; exit 1; }
          content=$(gh issue view "$ISSUE_URL" --json id --jq .id)
          item=$(gh api graphql -f project="$project" -f content="$content" -f query='
            mutation($project: ID!, $content: ID!) { addProjectV2ItemById(input: {projectId: $project, contentId: $content}) {
              item { id } } }' --jq .data.addProjectV2ItemById.item.id)
          missing=()
          for pair in "Status=Ready For Development" "Priority=P0 - Critical" "Work Type=Development"; do
            ids=$(jq -r --arg f "${pair%%=*}" --arg o "${pair#*=}" '.data.repositoryOwner.projectV2.fields.nodes[]
              | select(.name? == $f) | .id as $field | .options[] | select((.name | ascii_downcase) == ($o | ascii_downcase))
              | "\($field) \(.id)"' project.json | head -1)
            if [ -z "$ids" ]; then missing+=("$pair"); continue; fi
            gh api graphql -f project="$project" -f item="$item" -f field="${ids% *}" -f option="${ids#* }" -f query='
              mutation($project: ID!, $item: ID!, $field: ID!, $option: String!) { updateProjectV2ItemFieldValue(input: {
                projectId: $project, itemId: $item, fieldId: $field, value: {singleSelectOptionId: $option}}) {
                projectV2Item { id } } }' > /dev/null
            echo "Set $pair."
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Project #$PROJECT_NUMBER has no option for: ${missing[*]}. Set it on $ISSUE_URL by hand."
            exit 1
          fi
