name: PR branch policy

# Checks that a PR's source branch may merge into its target (rules in .github/scripts/check-pr-branch-policy.sh):
# main only accepts develop (a release) or hotfix/*; develop only accepts release/*, hotfix/* and chore/sync-main;
# release/* accepts develop, hotfixes and the work-branch prefixes in CONTRIBUTING.md.
# GitHub can't restrict a PR's source branch itself, so this required check does. It lives outside CI so that
# retargeting a PR ("edited") re-checks it against the new target without re-running the whole build.
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

concurrency:
  group: pr-branch-policy-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-source:
    # Keep this name: branch protection on main requires this check by name.
    name: PR source (main accepts develop or hotfix/*)
    # No job-level "if": a skipped run counts as passing, so a title edit could clear a failing check.
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: Test the branch policy
        run: bash .github/scripts/check-pr-branch-policy.test.sh

      - name: Check the source and target branches
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          BASE_REPO: ${{ github.repository }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: bash .github/scripts/check-pr-branch-policy.sh "$BASE_REF" "$HEAD_REF" "$BASE_REPO" "$HEAD_REPO"
