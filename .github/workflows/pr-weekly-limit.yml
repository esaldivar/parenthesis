name: Weekly PR limit

# At most 3 release/* -> develop PRs a week (Monday 12:00 AM Central), per docs/development-workflow.md. Other PRs
# do not consume this cap and cannot be blocked by it. GitHub can't stop a
# PR from being opened, so this check fails on the 4th and later PRs of the week until the owner adds the
# "owner-approved-pr" label. Make it a required check on the integration branch to block merging those PRs.
#
# pull_request_target runs this file and the script from default branch main, never the PR's code, so a PR can't edit
# the rules it is checked against. Nothing from the PR is checked out or executed.
on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited, labeled, unlabeled]

permissions:
  contents: read
  issues: read
  pull-requests: write

concurrency:
  group: pr-weekly-limit-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-limit:
    # Keep this name if the check is made required.
    name: Weekly PR limit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # The ref is the literal default branch, not event data (SonarQube githubactions:S7631).
      - uses: actions/checkout@v7
        with:
          ref: main
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: Count this week's release promotions into develop
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OWNER_LOGIN: ${{ github.repository_owner }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: node .github/scripts/dev-workflow.mjs pr-limit
