name: PR issue links

on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited, ready_for_review]

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: pr-issue-links-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    name: Tracking issue links
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Trusted base SHA only. Never execute or check out PR head code here.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          sparse-checkout: .github/scripts
          persist-credentials: false
      - name: Verify the current PR's tracking issues
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/pr-issue-links.mjs
