name: Release Tuesday

# Weekly release, two days after Sonar Sunday (owner decision, October 17, 2026). If develop has changes that main
# doesn't, this opens a release checklist issue, so the week's fixes (including Sonar Sunday's) reach the site. The
# release PR itself is opened by a person: PRs created with the workflow token wouldn't trigger the required checks.
on:
  schedule:
    - cron: "0 14 * * 2" # Tuesdays 14:00 UTC (9 AM Central, 8 AM in winter).
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  checklist:
    name: Release checklist
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Compare develop with main
        id: compare
        run: |
          ahead=$(gh api "repos/$GITHUB_REPOSITORY/compare/main...develop" --jq '.ahead_by')
          echo "ahead=$ahead" >> "$GITHUB_OUTPUT"
          gh api "repos/$GITHUB_REPOSITORY/compare/main...develop" --jq '.commits[] | "- " + (.commit.message | split("\n")[0])' > changes.md
          pr=$(gh pr list --repo "$GITHUB_REPOSITORY" --base main --head develop --state open --json url --jq '.[0].url // ""')
          echo "pr=$pr" >> "$GITHUB_OUTPUT"

      - name: Open the checklist
        if: steps.compare.outputs.ahead != '0'
        env:
          PR: ${{ steps.compare.outputs.pr }}
        run: |
          today=$(date -u +%Y-%m-%d)
          {
            echo "\`develop\` has changes that \`main\` (the site) doesn't have yet:"
            echo
            cat changes.md
            echo
            echo "**Release checklist:**"
            if [ -n "$PR" ]; then
              echo "- [x] Release PR open: $PR"
            else
              echo "- [ ] Open the release PR: \`develop\` → \`main\`."
            fi
            echo "- [ ] All required checks green, including the **SonarCloud Code Analysis** quality gate."
            echo "- [ ] Merge with a **merge commit** (not a squash)."
            echo "- [ ] Back-merge \`main\` into \`develop\` (\`chore/sync-main\`; see CONTRIBUTING.md)."
            echo "- [ ] Close this week's Sonar Sunday issue once its fixes are released."
          } > body.md
          gh label create release-tuesday --repo "$GITHUB_REPOSITORY" --color 2DA44E --description "Weekly release" --force
          gh issue create --repo "$GITHUB_REPOSITORY" --title "Release Tuesday: $today" --label release-tuesday --body-file body.md

      - name: Nothing to release
        if: steps.compare.outputs.ahead == '0'
        run: echo "main already has everything in develop. No release this week."
