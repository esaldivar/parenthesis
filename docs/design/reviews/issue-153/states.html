<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Issue 153 · state review</title>
<style>
:root{color-scheme:dark;--canvas:#10251e;--surface:#19372d;--text:#f7f5ed;--muted:#c0d0c5;--action:#91d2c5;--on:#10251e;--line:#8aa99a;--danger:#ffb4ab}
body.light{color-scheme:light;--canvas:#f7f5ed;--surface:#fff;--text:#203a31;--muted:#4d6258;--action:#176b67;--on:#fff;--line:#718478;--danger:#a13333}
*{box-sizing:border-box}body{margin:0;background:var(--canvas);color:var(--text);font:16px/1.5 system-ui,sans-serif;padding:32px}header{max-width:1160px;margin:0 auto 24px}header p{margin:0;color:var(--muted)}h1{font-size:28px;line-height:1.2;margin:8px 0 12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:24px;max-width:1160px;margin:auto}article{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:28px;display:flex;flex-direction:column;min-height:475px}.brand{display:flex;align-items:center;gap:12px;margin-bottom:24px}.brand img{width:48px;height:auto}.brand span{font-size:12px;color:var(--muted)}h2{font-size:24px;line-height:1.25;margin:0 0 16px}p{margin:0 0 16px;color:var(--muted)}.tag{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--action);margin-bottom:12px}.actions{margin-top:auto;padding-top:24px;display:flex;flex-direction:column;gap:8px}button{font:600 16px/1.5 system-ui;min-height:48px;padding:12px 20px;border:1px solid var(--action);border-radius:12px;color:var(--on);background:var(--action);text-align:center}button.secondary{background:transparent;color:var(--action)}label{display:block;margin:8px 0;color:var(--text)}input{display:block;width:100%;min-height:48px;padding:10px 12px;font:inherit;color:var(--text);background:var(--canvas);border:1px solid var(--line);border-radius:8px}.error{color:var(--danger);border-left:3px solid var(--danger);padding-left:12px;margin-top:12px}.note{font-size:13px;margin-top:16px}.avatar{width:64px;height:64px;border:1px solid var(--line);border-radius:50%;display:grid;place-items:center;margin:8px 0;font-size:24px}.focus{outline:3px solid var(--action);outline-offset:4px}button:focus-visible,input:focus-visible{outline:3px solid var(--action);outline-offset:4px}.single .grid{display:block}.single{padding:16px}.single header{display:none}.single article{padding:20px;min-height:0}.single .brand{flex-wrap:wrap}.single h2{overflow-wrap:anywhere}@media(max-width:700px){.grid{grid-template-columns:1fr}body{padding:16px}}
</style>
<header><p>Parenthesis / issue #153 / proposed state specifications</p><h1 id="heading"></h1><p>Awaiting owner review · exact approved icon · wordmark export pending · static design, no account actions</p></header><main class="grid"></main>
<script>
const field=(name,hint='')=>`<label>${name}<input type="password" inputmode="numeric" aria-label="${name}" readonly></label>${hint?`<p class="note">${hint}</p>`:''}`;
const states=[
['recovery','R1 · Request','Reset your parent PIN','We’ll send instructions to your registered email. You’ll also need your parent account password.','Send reset email','Back to profiles',''],
['recovery','R2 · Accepted','Check your email','If this request is eligible, a reset link is on its way. The link works once and expires. Check your spam folder too.','Back to profiles','Request another link','<p class="note">Resend becomes available after the server’s retry time. No email address is shown here.</p>'],
['recovery','R3 · Valid link + own credentials','Confirm it’s you','Sign in with your own parent account to continue. The link alone cannot reset your PIN.','Sign in','Forgot password?','<label>Email address<input type="email" aria-label="Email address" readonly></label><label>Password<input type="password" aria-label="Password" readonly></label>'],
['recovery','R4 · Authenticated reset','Create a new parent PIN','Your parent PIN has 6 digits. This changes your PIN, not your password.','Save PIN','Cancel',field('New PIN')+field('Confirm new PIN')],
['edges','E1 · Expired / already used / invalid','This reset link can’t be used','It may have expired or already been used. Request a new link to reset your parent PIN.','Request a new link','Back to sign in','<p class="note">Same screen for all invalid links. No account or device details.</p>'],
['edges','E2 · No inbox access','Can’t access your email?','Try to recover access through your email provider. Parenthesis can’t skip the email and password checks.','Back to sign in','Back to profiles','<p class="note">If you forgot your password, recover your account first. Other profiles remain available on eligible shared devices.</p>'],
['edges','E3 · Save validation','Check your new PIN','Enter and confirm a six-digit parent PIN.','Save PIN','Cancel',field('New PIN')+field('Confirm new PIN')+'<p class="error" role="alert">The PINs don’t match. Enter them again.</p>'],
['edges','E4 · Confirmed success','Your parent PIN was reset','Use your new PIN the next time you enter your parent profile.','Continue to your account','','<p class="note" role="status">No PIN is displayed or included in an email. Continue only while your authenticated session is valid.</p>'],
['devices','D1 · Revoked or 30-day expiry','Set up this device again','A parent needs to sign in and explicitly set up sharing again before profiles can be used here.','Parent sign in','','<p class="note">No old profile names or pictures. Signing in alone does not restore sharing.</p>'],
['devices','D2 · Session expired','Your session has ended','Choose a profile to continue on this eligible shared device.','Choose a profile','Sign out of this device','<p class="note">If device eligibility cannot be confirmed, show the parent sign-in route instead. Do not restore protected content.</p>'],
['devices','D3 · Loading / failed refresh','We couldn’t load profiles','Check your connection and try again.','Try again','Sign out of this device','<p class="note">Loading variant: “Loading profiles…” with no tiles or cached names. Retry never displays stale profile data.</p>'],
['devices','D4 · Authenticated Settings only','Remove this shared device?','Living-room tablet · last used today. Removing it ends parent and child access on this device. Other devices stay available.','Remove device','Cancel','<p class="note">Device details are visible only to an authorized parent. Confirmed removal returns focus to the device list.</p>'],
['profiles','P1 · Empty / pending children','Who’s using Parenthesis?','No child profiles are available on this device yet.','Alex · Parent','Sign out of this device','<div class="avatar" aria-hidden="true">A</div><p class="note">Sign in to your parent account to manage children. Approval details appear only there.</p>'],
['profiles','P2 · Child without PIN','A parent needs to set up a PIN','This profile can’t sign in yet. Ask a parent for help.','Back to profiles','','<div class="avatar" aria-hidden="true">T</div><p class="note">Taylor · Child. The tile is descriptive, not a disabled unexplained link. No child approval details.</p>'],
['profiles','P3 · Explicit setup','Is this a shared family device?','Only set up sharing on a device your family controls. Profile names will be visible here for 30 days.','Yes, set up sharing','No, continue privately','<p class="note">Next: create your six-digit parent PIN if needed. Continue to your account without another password prompt.</p>'],
['profiles','P4 · Parent PIN error / lock','That PIN didn’t work','Enter your six-digit parent PIN.','Continue','Back to profiles',field('Parent PIN')+'<p class="error" role="alert">That PIN didn’t work. 2 tries left.</p><p class="note">Lock variant: “Your parent PIN is locked. Reset your PIN to continue.” Primary: Reset PIN. Password recovery remains available.</p>']
];
const q=new URLSearchParams(location.search), group=q.get('group')||'recovery'; if(q.get('theme')==='light')document.body.classList.add('light');if(q.has('state'))document.body.classList.add('single');
document.querySelector('#heading').textContent=({recovery:'Parent recovery · complete core flow',edges:'Recovery · edge cases',devices:'Device and session states',profiles:'Picker and setup · remaining states'})[group];
document.querySelector('main').innerHTML=states.filter((s,i)=>q.has('state')?i===Number(q.get('state')):s[0]===group).map(s=>`<article><div class="brand"><img src="../../assets/parenthesis-icon.svg" alt="Parenthesis"><span>Exact icon · wordmark artwork pending</span></div><div class="tag">${s[1]}</div><h2>${s[2]}</h2><p>${s[3]}</p>${s[6]}<div class="actions"><button>${s[4]}</button>${s[5]?`<button class="secondary">${s[5]}</button>`:''}</div></article>`).join('');
</script></html>
