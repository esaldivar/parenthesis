<a class="skip-link" href="#main-content">Skip to main content</a>

<div class="shell">
  <header class="topbar">
    <a class="brand" routerLink="/" aria-label="Parenthesis home">
      <span class="brand__mark" aria-hidden="true">( )</span>
      <span class="brand__name">Parenthesis</span>
    </a>
  </header>

  <nav class="sidenav" aria-label="Main">
    <ul>
      @for (item of nav; track item.path) {
        <li>
          <a
            [routerLink]="item.path"
            routerLinkActive="is-active"
            [routerLinkActiveOptions]="{ exact: item.path === '/' }"
            ariaCurrentWhenActive="page"
          >
            <app-icon [name]="item.icon" />
            <span>{{ item.label }}</span>
            @if (item.note) {
              <span class="note"><span class="visually-hidden">, </span>{{ item.note }}</span>
            }
          </a>
        </li>
      }
    </ul>
  </nav>

  <main id="main-content" #main tabindex="-1">
    <router-outlet />
  </main>

  <nav class="bottomnav" aria-label="Main">
    <ul>
      @for (item of mobileNav; track item.path) {
        <li>
          <a
            [routerLink]="item.path"
            routerLinkActive="is-active"
            [routerLinkActiveOptions]="{ exact: item.path === '/' }"
            ariaCurrentWhenActive="page"
          >
            <app-icon [name]="item.icon" />
            <span>{{ item.label }}</span>
          </a>
        </li>
      }
    </ul>
  </nav>
</div>
