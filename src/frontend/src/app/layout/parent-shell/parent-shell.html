<a class="skip-link" href="#main-content">Skip to main content</a>

<mat-menu #accountMenu="matMenu" xPosition="before">
  <a mat-menu-item routerLink="/settings">
    <app-icon name="settings" [size]="20" />
    <span>Settings</span>
  </a>
  <button mat-menu-item type="button" (click)="signOut()">
    <span>Sign out</span>
  </button>
</mat-menu>

<div class="shell">
  <aside class="sidebar">
    <a class="brand" routerLink="/" aria-label="Parenthesis home">
      <app-logo [decorative]="true" />
    </a>

    <nav class="sidenav" aria-label="Main">
      <ul>
        @for (item of nav; track item.path) {
          <li>
            <a
              [routerLink]="item.path"
              routerLinkActive="is-active"
              [routerLinkActiveOptions]="{ exact: item.path === '/' }"
              ariaCurrentWhenActive="page"
            >
              <app-icon [name]="item.icon" [size]="26" />
              <span>{{ item.label }}</span>
            </a>
          </li>
        }
      </ul>
    </nav>

    <div class="sidebar__decor">
      <app-leaves />
      <p class="tagline">Different homes.<br />Same love.</p>
    </div>

    <button class="profile" type="button" [matMenuTriggerFor]="accountMenu" aria-label="Account menu">
      <app-avatar [name]="firstName()" kind="parent" [size]="40" />
      <span class="profile__hi">Hi, {{ firstName() }}!</span>
      <app-icon name="chevron-down" [size]="20" />
    </button>
  </aside>

  <header class="topbar">
    <a class="brand brand--compact" routerLink="/" aria-label="Parenthesis home">
      <app-logo [decorative]="true" />
    </a>
    <button class="account" type="button" [matMenuTriggerFor]="accountMenu" aria-label="Account menu">
      <app-avatar [name]="firstName()" kind="parent" [size]="36" />
      <span class="account__name">{{ firstName() }}</span>
      <app-icon name="chevron-down" [size]="20" />
    </button>
  </header>

  <main id="main-content" #main tabindex="-1">
    <router-outlet />
  </main>

  <nav class="bottomnav" aria-label="Main">
    <ul>
      @for (item of mobileNav; track item.path) {
        <li>
          <a
            [routerLink]="item.path"
            routerLinkActive="is-active"
            [routerLinkActiveOptions]="{ exact: item.path === '/' }"
            ariaCurrentWhenActive="page"
          >
            <app-icon [name]="item.icon" />
            <span>{{ item.label }}</span>
          </a>
        </li>
      }
    </ul>
  </nav>
</div>
